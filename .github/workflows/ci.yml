name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege token; actions pinned to commit SHAs (R-11 — mutable major
# tags are a supply-chain vector). Bump pins deliberately, with the tag noted.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The kit runs on macOS only (owner, 2026-11-25). The suite is split into 4 shards that run side
    # by side, within the 5 macOS jobs an account runs at once: one runner took up to 22 minutes.
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Fault-injection test suite (shard ${{ matrix.shard }} of 4)
        run: node --test --test-shard=${{ matrix.shard }}/4 tests/*.test.mjs
      - name: Shell syntax
        if: matrix.shard == 1
        run: |
          for f in scripts/*.sh scripts/watchdog/*.sh; do bash -n "$f"; done
      - name: Kit validator (self-check)
        if: matrix.shard == 1
        run: bash scripts/validate-team.sh .
      - name: Context budget ratchet
        if: matrix.shard == 1
        run: bash scripts/measure-context.sh .

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: ShellCheck
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          shellcheck -S warning scripts/*.sh scripts/watchdog/*.sh

  public-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      # Client names come from a secret so this public file does not list them;
      # a fork PR has no secret and is checked for tracker ids only.
      - name: No client identifiers in the tracked tree
        env:
          PUBLIC_DATA_DENYLIST: ${{ secrets.PUBLIC_DATA_DENYLIST }}
        run: bash scripts/check-public-data.sh .

  # Single stable check name for a branch ruleset (R5-09): require 'ci-required'
  # instead of chasing matrix-expanded job names.
  ci-required:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test, shellcheck, public-data]
    if: always()
    steps:
      - name: All required jobs green
        # Every dependency must be exactly 'success' (R6-12): needs.*.result
        # can also be 'skipped', which a failure/cancelled check reads as green
        # the moment any dependency gains a job-level condition.
        run: |
          [ "${{ needs.test.result }}" = "success" ]
          [ "${{ needs.shellcheck.result }}" = "success" ]
          [ "${{ needs.public-data.result }}" = "success" ]
