name: Report role skill upstream drift
on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Compare upstream and report to PM
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/role-skills-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.md"
          node scripts/role-skills.mjs prepare-update "$report"
          if [[ -f "$report" ]]; then
            node scripts/role-skills.mjs verify
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
            echo '::warning::Upstream skill changes detected. PM review required; nothing published.'
            exit 1
          fi
          echo 'Selected files unchanged.' >> "$GITHUB_STEP_SUMMARY"
